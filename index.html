<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundscapade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1430'/%3E%3Cpath d='M10 40c6-10 12-10 18 0s12 10 18 0' stroke='%2346f0aa' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10 28c6-10 12-10 18 0s12 10 18 0' stroke='%23a07ce6' stroke-width='3' fill='none' stroke-linecap='round' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Alegreya Sans: a humanist sans with calligraphic warmth. Plex Mono is only for the Signals canvas. -->
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ink: #f1efe9;
    --soft: rgba(241, 239, 233, 0.86);
    --faint: rgba(241, 239, 233, 0.64);
    --sans: 'Alegreya Sans', 'Gill Sans', 'Optima', sans-serif;
    --edge: clamp(20px, 5vw, 64px);
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 0 14px rgba(0,0,0,.4), 0 0 32px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; color: var(--ink); }
  body { font-family: var(--sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
  body.idle { cursor: none; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  button { font: inherit; }
  button:focus-visible { outline: 1px solid var(--faint); outline-offset: 4px; border-radius: 2px; }

  /* soft scrims, top and bottom, so text holds over bright skies and snow */
  #scrim {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 62% 62% at 14% 8%, rgba(0,0,0,.5), rgba(0,0,0,.22) 50%, transparent 78%),
      radial-gradient(ellipse 60% 26% at 50% 100%, rgba(0,0,0,.5), transparent 100%);
    transition: opacity 2s ease;
  }
  body.idle #scrim { opacity: .45; }

  /* ---------------------------------------- caption, top-left */
  #caption {
    position: fixed; left: var(--edge); top: clamp(26px, 7vh, 72px);
    max-width: min(27em, calc(100vw - 2 * var(--edge)));
    opacity: 0; transform: translateY(-6px); transition: opacity 1.6s ease, transform 1.6s ease;
    text-shadow: var(--shadow); pointer-events: none;
  }
  #caption.show { opacity: 1; transform: none; }
  body.idle #caption.show { opacity: .6; }
  #c-title { font-size: clamp(30px, 3.6vw, 44px); font-weight: 300; line-height: 1.08; letter-spacing: -.005em; margin: 12px 0 6px; }
  #c-place { font-size: 17px; font-weight: 400; font-style: italic; color: var(--soft); }
  #c-story { font-size: 17px; font-weight: 400; line-height: 1.55; color: var(--soft); margin: 18px 0 14px; max-width: 25em; }
  #c-credit { font-size: 13px; font-weight: 400; line-height: 1.5; letter-spacing: .03em; color: rgba(241,239,233,.7); max-width: 30em; }
  #c-story, #c-credit { transition: opacity .6s; }
  body.idle #c-story, body.idle #c-credit { opacity: 0; transition: opacity 2s; }

  /* ---------------------------------------- controls, top-right */
  .ctls {
    position: fixed; top: clamp(26px, 7vh, 72px); right: var(--edge);
    display: flex; gap: 26px; transition: opacity 1.4s ease;
  }
  .ctl {
    background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--soft);
    font-size: 12px; font-weight: 400; letter-spacing: .24em; text-transform: uppercase;
    text-shadow: var(--shadow); transition: color .4s;
  }
  .ctl:hover { color: var(--ink); }

  /* ---------------------------------------- channels, a centred row at the bottom */
  #bar {
    position: fixed; left: 0; right: 0; bottom: clamp(26px, 6vh, 52px); padding: 0 16px;
    text-align: center; transition: opacity 1.4s ease;
  }
  /* until the first click the browser won't play sound, so the hint stays put */
  body.locked.idle .ctls { opacity: 1; }
  body.locked #mute { color: var(--ink); }
  body.idle #bar, body.idle .ctls { opacity: 0; }
  #channels { display: flex; justify-content: center; flex-wrap: wrap; row-gap: 6px; }
  #channels button {
    background: none; border: 0; cursor: pointer; color: var(--faint); padding: 4px 0;
    font-size: 13px; font-weight: 400; letter-spacing: .26em; text-transform: uppercase;
    text-shadow: var(--shadow); transition: color .5s;
  }
  #channels .br { display: none; }
  #channels > * + button::before {
    content: '·'; display: inline-block; width: clamp(26px, 3.4vw, 44px); letter-spacing: 0;
    color: rgba(241,239,233,.32); pointer-events: none;
  }
  #channels button:hover, #channels button.on { color: var(--ink); }

  @media (max-width: 640px) {
    :root { --edge: 22px; }
    #caption { top: 26px; }
    #c-title { font-size: 30px; }
    #c-story { font-size: 16px; line-height: 1.5; margin: 14px 0 12px; }
    #c-credit { font-size: 12px; }
    .ctls { top: auto; bottom: 22px; left: 0; right: 0; justify-content: center; gap: 34px; }
    #bar { bottom: 62px; }
    #channels { row-gap: 8px; }
    #channels button { font-size: 12px; letter-spacing: .2em; }
    #channels > * + button::before { width: 22px; }
    #channels .br { display: block; flex-basis: 100%; height: 0; }
    #channels .br + button::before { display: none; }
    #scrim {
      background:
        linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.3) 38%, transparent 62%),
        linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.2) 22%, transparent 34%);
    }
  }
</style>
</head>
<body class="locked">
<canvas id="view"></canvas>
<div id="scrim"></div>

<div id="caption" aria-live="polite">
  <div id="c-title"></div>
  <div id="c-place"></div>
  <div id="c-story"></div>
  <div id="c-credit"></div>
</div>

<div class="ctls">
  <button class="ctl" id="mute">click for sound</button>
  <button class="ctl" id="next">next sound →</button>
</div>

<div id="bar">
  <nav id="channels" aria-label="Channels"></nav>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
